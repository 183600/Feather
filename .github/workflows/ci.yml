name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  moon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Resolve MoonBit dependencies
        run: ./moon update

      - name: Check default target
        run: ./moon check

      - name: Check native target
        run: ./moon check --target native

      - name: Test default target
        run: ./moon test

      - name: Test native target
        run: ./moon test --target native

      - name: Check repository hygiene
        run: bash scripts/check-hygiene.sh
