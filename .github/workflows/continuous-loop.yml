name: Continuous Loop

on:
  workflow_dispatch:
  # 每 15 分钟一次「心跳」+ 下面 concurrency 排队，保证「一个 job 结束后立刻触发下一个」：
  # 任何时刻组内最多 1 个 running + 1 个 pending；当前 run 无论以何种方式结束
  # （成功 / 失败 / 被取消 / runner 意外宕机），队列中的下一个 run 都会在几秒内开始。
  # 即使收尾的 self-dispatch 步骤被 GitHub 跳过（runner 宕机时连 if: always()
  # 步骤也不会执行），下一次心跳也能在 ≤15 分钟内补位续跑，链条永不断。
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: continuous-loop
  cancel-in-progress: false

jobs:
  run-opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      contents: write
      actions: write

    steps:
      # ⭐ 立刻续跑（上）：本 run 一开始就把「下一个 run」排进 concurrency 队列。
      # concurrency.cancel-in-progress=false → 组内 1 running + 1 pending，
      # 本 run 无论以何种方式结束（成功 / 失败 / 超时被取消 / runner 宕机），
      # 队列里的后继 run 都会在几秒内自动开始；不依赖任何收尾步骤是否被执行。
      - name: Queue next run (immediate hand-off)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          BRANCH="${GITHUB_REF_NAME}"
          WF_REF="${GITHUB_WORKFLOW_REF%%@*}"
          WF_FILE="${WF_REF##*/}"
          case "$WF_FILE" in
            *.yml|*.yaml) ;;
            *) WF_FILE="continuous-loop.yml" ;;
          esac
          echo "[loop] repo=${GH_REPO} workflow=${WF_FILE} branch=${BRANCH} run=${RUN_ID}"
          # 组内是否已有「另一个」排队中的 run（排除当前 run 自己：
          # 它刚启动时 API 状态可能还是 pending，不能当成后继）
          pending_other() {
            gh api "repos/${GH_REPO}/actions/workflows/${WF_FILE}/runs?per_page=30" \
              --jq '[.workflow_runs[] | select((.id|tostring) != "'"${RUN_ID}"'") | select(.status=="pending" or .status=="queued" or .status=="waiting" or .status=="requested")] | length' \
              2>/dev/null
          }
          Q="$(pending_other)"
          # 查询失败时按 0 处理：宁可多派一个（会被队列合并），也绝不能漏派而断链
          case "$Q" in ''|*[!0-9]*) Q=0 ;; esac
          echo "[loop] queued successors before dispatch: ${Q}"
          if [ "$Q" != "0" ]; then
            echo "[loop] 后继 run 已在队列中，无需重复派发"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if gh workflow run "$WF_FILE" --ref "$BRANCH"; then
              for _ in 1 2 3 4 5 6; do
                sleep 5
                Q="$(pending_other)"
                case "$Q" in ''|*[!0-9]*) Q=0 ;; esac
                if [ "$Q" != "0" ]; then
                  echo "[loop] 后继 run 已排队（attempt ${attempt}）——当前 run 一结束它就会立刻起跑"
                  exit 0
                fi
              done
              echo "[loop][warn] 派发已提交但暂未看到排队的 run（attempt ${attempt}）"
            else
              echo "[loop][warn] 派发失败（attempt ${attempt}）"
            fi
            sleep 10
          done
          echo "[loop][warn] 未能确认后继 run；收尾的 next-run job 与 */15 心跳会补位"
          exit 0

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free up disk space (keep miniconda)
        run: |
          set +e
          echo "=== disk before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet \
                      /usr/share/swift \
                      /usr/local/lib/android \
                      /usr/local/share/boost \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean
          echo "=== disk after cleanup ==="
          df -h /

      # MoonBit 工具链 / 依赖缓存 + npm 全局包缓存。
      # 本仓库没有 package-lock.json，无法用 setup-node 的 `cache: npm`（它要求 lock 文件存在），
      # 因此直接缓存 ~/.npm；仓库用自带的 `moon` 包装脚本跑 `bash moon test`，同时缓存
      # ~/.moon（工具链）与 ~/.mooncakes（依赖），供其直接复用。
      - name: Cache MoonBit toolchain, mooncakes and npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.moon
            ~/.mooncakes
            ~/.npm
          key: ${{ runner.os }}-moonbit-npm-${{ hashFiles('moon.mod', 'moon.pkg') }}
          restore-keys: |
            ${{ runner.os }}-moonbit-npm-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify mock moon gate
        run: |
          set +e
          bash moon test || echo "[warn] mock moon test 异常"

      - name: Configure swap (safe version)
        run: |
          set -e
          echo "=== Before ==="
          free -h
          df -h /

          sudo systemctl disable --now systemd-oomd.socket systemd-oomd.service 2>/dev/null || true

          sudo modprobe zram 2>/dev/null || true
          if [ -e /dev/zram0 ]; then
            sudo swapoff /dev/zram0 2>/dev/null || true
            echo 8G | sudo tee /sys/block/zram0/disksize >/dev/null || true
            sudo mkswap /dev/zram0 >/dev/null 2>&1 || true
            sudo swapon -p 100 /dev/zram0 2>/dev/null && echo "[ok] zram enabled (8G, prio=100)" \
              || echo "[warn] zram enable failed"
          else
            echo "[info] zram not available, skip"
          fi

          AVAIL_KB=$(df --output=avail / | tail -1)
          AVAIL_MB=$((AVAIL_KB / 1024))
          WANT_MB=$((AVAIL_MB - 3072))
          if [ "$WANT_MB" -gt 8192 ]; then WANT_MB=8192; fi
          if [ "$WANT_MB" -lt 2048 ]; then WANT_MB=2048; fi
          echo "[info] available disk: ${AVAIL_MB}MB, will create swapfile: ${WANT_MB}MB"

          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          if ! sudo fallocate -l "${WANT_MB}M" /swapfile 2>/dev/null; then
            echo "[info] fallocate failed, falling back to dd"
            sudo dd if=/dev/zero of=/swapfile bs=1M count=$WANT_MB status=none
          fi
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null
          sudo swapon -p 10 /swapfile && echo "[ok] swapfile enabled"

          sudo sysctl -w vm.swappiness=100
          sudo sysctl -w vm.vfs_cache_pressure=200
          sudo sysctl -w vm.overcommit_memory=1
          sudo sysctl -w vm.dirty_ratio=40
          sudo sysctl -w vm.dirty_background_ratio=10
          sudo sysctl -w vm.watermark_scale_factor=200 2>/dev/null || true

          echo "=== After ==="
          free -h
          swapon --show
          df -h /

      - name: Install opencode
        run: npm i -g opencode-ai

      - name: Configure opencode (free models + tamper protection)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          # opencode 自带的 OpenCode Zen 免费 provider 无需任何 API key；
          # 如需更高限额，可在仓库 secrets 里可选配置 OPENCODE_API_KEY。
          if [ -n "$OPENCODE_API_KEY" ]; then
            echo "[info] OPENCODE_API_KEY 已配置（用于提升免费模型限额）"
          else
            echo "[info] 未配置 OPENCODE_API_KEY，匿名使用免费模型（有速率限制）"
          fi
          mkdir -p ~/.config/opencode
          # 免费模型路径的基准配置（权限锁定）；NVIDIA 路径的配置由主循环的探测脚本
          # 以本文件为基础合并生成 opencode.nvidia.json（保留同样的权限锁定）。
          cat > ~/.config/opencode/opencode.free.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "permission": {
              "*": "allow",
              "edit": {
                "*": "allow",
                ".github/**": "deny",
                "**/.github/**": "deny",
                "LICENSE": "deny",
                "LICENSE.*": "deny",
                "**/LICENSE": "deny",
                "**/LICENSE.*": "deny"
              },
              "bash": {
                "*": "allow",
                "rm -rf .github*": "deny",
                "rm -r .github*": "deny",
                "rm .github*": "deny",
                "mv .github*": "deny",
                "git rm -r .github*": "deny",
                "rm *LICENSE*": "deny",
                "mv *LICENSE*": "deny",
                "cp *LICENSE*": "deny",
                "git rm *LICENSE*": "deny",
                "git mv *LICENSE*": "deny",
                "shred *LICENSE*": "deny",
                "truncate *LICENSE*": "deny",
                "unlink *LICENSE*": "deny",
                "dd *of=LICENSE*": "deny",
                "find * -name *LICENSE*": "deny",
                "rm *PLAN.md": "deny",
                "mv *PLAN.md": "deny",
                "git rm *PLAN.md": "deny",
                "rm *_test*.mbt": "deny",
                "mv *_test*.mbt": "deny",
                "git rm *_test*.mbt": "deny",
                "git push*": "deny",
                "git checkout --orphan*": "deny",
                "git switch --orphan*": "deny",
                "git filter-branch*": "deny",
                "git rebase*": "deny",
                "git branch -D*": "deny",
                "git update-ref*": "deny",
                "git symbolic-ref*": "deny",
                "git reflog*": "deny",
                "git gc*": "deny",
                "git remote add*": "deny",
                "git remote remove*": "deny",
                "git remote set-url*": "deny"
              }
            }
          }
          EOF
          cp -f ~/.config/opencode/opencode.free.json ~/.config/opencode/opencode.json
          echo "[guard] opencode 权限已锁定：edit/bash 对 .github/** 与 LICENSE 禁止操作"

          echo "=== OpenCode Zen 可用模型目录 ==="
          opencode models opencode 2>/dev/null \
            || opencode models 2>/dev/null | grep -F 'opencode/' \
            || echo "[warn] 暂时无法获取模型列表，将在运行时重试"

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


      - name: Run agent loop for ~3 hours (phases per iteration)
        timeout-minutes: 180
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set +e
          set -o pipefail
          BRANCH="${GITHUB_REF_NAME:-main}"
          OUT=/tmp/oc_out.log
          # 单次 run 的硬预算：3 小时（step 上限 180 分钟，job 上限 200 分钟，
          # 这里留 10 分钟给收尾的清理 / 最终提交 / 推送）
          DEADLINE=$(( $(date +%s) + 3*3600 - 600 ))

          # ================= 五阶段提示词（perf -> bug -> improve -> complete -> clean） =================
          # improve 阶段承接 ada-squash 原 apply 阶段的位置：任务为「改进这个项目」。
          # complete 阶段：确保项目功能完整（核对已声明的功能是否真的可用并补齐）。
          PROMPT_PERF='优化 Feather（MoonBit Gin/Express 风格 Web 框架）的性能和资源占用，可以改进路由匹配、头部处理、分配与缓存局部性，但不得改变对外功能语义。先读 README.md、PLAN.md 和现有实现；项目已实现核心与 HTTP 服务器，不要重写已存在的功能。每次改动后运行 ./moon check 与 ./moon test 自检，不通过就自己修好；涉及 server/async 时再跑 ./moon check --target native。禁止提交 zz_/tmp_/scratch/dbg 前缀的临时测试或探针文件，临时脚本写到 /tmp；测试文件名必须描述行为。不要输出或写入“优化了哪些内容”的报告。.github、LICENSE、README*.md、PLAN.md 与所有测试文件不得删除或削弱。'
          PROMPT_BUG='仔细检查 Feather（MoonBit Web 框架）的代码中是否存在 bug，如果有就修改代码。修复必须保持原有功能语义不变，不得借修复之名做无意义的等价重写；不得削弱或删除测试。先读 README.md、PLAN.md 与相关源码，并针对修复补一个回归测试。每次改动后运行 ./moon check 与 ./moon test 自检，不通过就自己修好；涉及 server/async 时再跑 ./moon check --target native。禁止提交 zz_/tmp_/scratch/dbg 前缀的临时测试或探针文件，临时脚本写到 /tmp。.github、LICENSE、README*.md、PLAN.md 与所有既有测试不得删除或削弱。'
          PROMPT_IMPROVE='改进 Feather（MoonBit Gin/Express 风格 Web 框架）。先通读 README.md、PLAN.md 和现有代码，理解已实现能力与剩余缺口，然后做实质性增量改进：补全缺失的边界路径、完善中间件/上下文能力、提升测试覆盖或可用性。不要重写已经可用的大块功能，也不要把 README 改回“只有计划”的占位稿。每次改动后运行 ./moon check 与 ./moon test 自检，不通过就自己修好；涉及 server/async 时再跑 ./moon check --target native；新增功能必须带测试。禁止提交 zz_/tmp_/scratch/dbg 前缀的临时测试或探针文件，临时脚本写到 /tmp。.github、LICENSE、README*.md、PLAN.md 与所有测试文件不得删除或削弱。每完成一个可验证的改动就立即 git commit（不要 push、不要 amend）。'
          PROMPT_CLEAN='确保远程仓库里没有实验结果文件、REPORT*.md、临时调试脚本与调试输出等杂物；确保仓库中没有任何关于修复了哪些bug、优化或改进了哪些内容的记录（包括注释）。删除所有其他多余的内容。注意：.github 目录是 CI 配置，必须原样保留，绝对不能删除、修改或移动其中任何文件，它不属于“多余的内容”；LICENSE 是开源许可证文件，同样必须原样保留，也不属于“多余的内容”；README*.md（含所有语言版本的 README）是项目说明文档，同样必须原样保留，不能删除或移动；PLAN.md 是项目规划文档，不能删除；测试代码不能删除或削弱；仍被项目引用的数据文件不属于“多余的内容”，必须保留。'
          PROMPT_COMPLETE='确保 Feather（MoonBit Web 框架）的功能完整。先通读 README.md、PLAN.md 与现有代码，逐项核对 README 声明的功能是否真的完整可用：补齐未实现或只做了一半的路径，修好跑不通的入口，让核心功能端到端可用。不要重做已经可用的实现。每次改动后运行 ./moon check 与 ./moon test 自检，不通过就自己修好；涉及 server/async 时再跑 ./moon check --target native。禁止提交 zz_/tmp_/scratch/dbg 前缀的临时测试或探针文件，临时脚本写到 /tmp。.github、LICENSE、README*.md、PLAN.md 与所有测试文件不得删除或削弱。每完成一个可验证的改动就立即 git commit（不要 push、不要 amend）。'

          # 每阶段单次调用的最大时长（秒）
          PERF_TIMEOUT=$((3*3600))     # 3h
          BUG_TIMEOUT=$((3*3600))      # 3h
          IMPROVE_TIMEOUT=$((3*3600))   # 3h
          COMPLETE_TIMEOUT=$((3*3600))  # 3h
          CLEAN_TIMEOUT=$((3*3600))    # 3h

          # ================= 动态模型池（不写死，实时读取线上目录） =================
          # 池直接来自 `opencode models opencode` 的实时输出：模型上新自动入池、
          # 下线自动出池，无需再改本文件。目录暂时不可达时池置空，
          # detect_provider 会在每个 run 开始时惰性重建重试。
          # 现在同时通过 --verbose 读取每个模型支持的 variant（思考强度档位）。
          declare -A MODEL_VARIANTS=()
          declare -a FREE_MODELS=()
          # ================= 优先模型：deepseek-v4.1-flash-free =================
          # 池中存在时始终优先选用；不存在时保持随机选择。
          # 本次 run 内若优先模型刚失败/限流，会被标记失效并回退兜底/随机；下个 run 重新开始。
          PREFERRED_MODEL="opencode/deepseek-v4.1-flash-free"
          # ================= 兜底模型：big-pickle =================
          # 优先模型 deepseek-v4.1-flash-free 失效（限流/失败/不在池中）时，
          # 优先切换 opencode/big-pickle（Big Pickle，同为 Zen 网关免费模型）；
          # big-pickle 也不可用时才回退随机模型。
          FALLBACK_MODEL="opencode/big-pickle"

          # ================= 副选 provider：NVIDIA GLM（已停用） =================
          # 实测（2026-10-19/20 的 4 个 run，共 14 次 NVIDIA 阶段）：14/14 全部被阶段预算杀掉，
          # 一次都没在预算内返回；单个工具调用延迟约 121s，5 分钟只走 2~3 步。
          # 历史提交里 NVIDIA 只占 8/183（4%）。默认关闭，需要时把 NVIDIA_PROB 调回 20 即可。
          # NVIDIA 端点 https://integrate.api.nvidia.com/v1，模型优先 glm-5.3，目录中
          # 不存在时自动改用 glm-5-3-flash；无 NVIDIA_API_KEY / 端点失效 / 无 GLM 模型时
          # 自然回落免费模型。harness 保持统一：所有 provider 一律通过同一 agent CLI 调用。
          NVIDIA_PROB=0
          NVIDIA_MODEL=""
          CURRENT_PROVIDER="free"
          BROKEN_PROVIDERS=""
          # 本次 run 内选定的模型（探测只在 run 开始时做一次，见 detect_provider）
          SELECTED_MODEL=""
          SELECTED_PROVIDER=""

          mark_broken() {
            case ",$BROKEN_PROVIDERS," in *",$1,"*) ;; *) BROKEN_PROVIDERS="$BROKEN_PROVIDERS${BROKEN_PROVIDERS:+,}$1" ;; esac
          }
          is_broken() {
            case ",$BROKEN_PROVIDERS," in *",$1,"*) return 0 ;; *) return 1 ;; esac
          }

          # ---------- NVIDIA GLM 探测：优先 glm-5.3，没有则 glm-5-3-flash ----------
          # 探测成功同时把 nvidia provider 配置写入 ~/.config/opencode/opencode.nvidia.json
          # （可选合并 $1 指定的基准配置，保留其中已有字段，如权限锁定）。
          cat > /tmp/probe_nvidia.py <<'PYEOF'
          import json, os, sys, urllib.request

          def emit(status, model=''):
              print((status + ' ' + model).strip())
              sys.exit(0)

          def norm(s):
              return s.lower().replace('.', '-').replace('_', '-')

          key = os.environ.get('NVIDIA_API_KEY', '').strip()
          if not key:
              emit('DOWN')
          try:
              req = urllib.request.Request(
                  'https://integrate.api.nvidia.com/v1/models',
                  headers={'Authorization': 'Bearer ' + key})
              with urllib.request.urlopen(req, timeout=20) as r:
                  d = json.load(r)
          except Exception:
              emit('DOWN')

          ids = [m.get('id', '') for m in (d.get('data') or []) if m.get('id')]

          def pick(cands, target):
              if not cands:
                  return ''
              def keyf(x):
                  return (0 if norm(x.rsplit('/', 1)[-1]) == target else 1, len(x))
              return sorted(cands, key=keyf)[0]

          primary = [i for i in ids if 'glm-5-3' in norm(i) and 'flash' not in norm(i)]
          flash = [i for i in ids if 'glm-5-3' in norm(i) and 'flash' in norm(i)]
          mid = pick(primary, 'glm-5-3') or pick(flash, 'glm-5-3-flash')
          if not mid:
              emit('NOMODEL')

          cfg = {}
          base = sys.argv[1] if len(sys.argv) > 1 else ''
          if base and os.path.exists(base):
              try:
                  with open(base) as f:
                      cfg = json.load(f)
              except Exception:
                  cfg = {}
          cfg['$schema'] = 'https://opencode.ai/config.json'
          cfg.setdefault('provider', {})
          cfg['provider']['nvidia'] = {
              'npm': '@ai-sdk/openai-compatible',
              'name': 'NVIDIA',
              'options': {
                  'baseURL': 'https://integrate.api.nvidia.com/v1',
                  'apiKey': '{env:NVIDIA_API_KEY}',
              },
              'models': {mid: {'name': mid}},
          }
          cfg['model'] = 'nvidia/' + mid
          try:
              os.makedirs(os.path.expanduser('~/.config/opencode'), exist_ok=True)
              with open(os.path.expanduser('~/.config/opencode/opencode.nvidia.json'), 'w') as f:
                  json.dump(cfg, f, indent=2, ensure_ascii=False)
          except Exception:
              pass
          emit('OK', mid)
          PYEOF

          probe_nvidia() {
            local out st mid
            out="$(python3 /tmp/probe_nvidia.py "$HOME/.config/opencode/opencode.free.json" 2>/dev/null)" || out="DOWN"
            st="${out%% *}"; mid="${out#* }"
            if [ "$st" = "OK" ] && [ "$mid" != "$out" ] && [ -n "$mid" ]; then
              NVIDIA_MODEL="$mid"; return 0
            fi
            NVIDIA_MODEL=""; return 1
          }
          # ---- 解析脚本：从 --verbose 输出提取模型 ID + 支持的 variant 列表 ----
          # `opencode models --verbose` 在每个模型行后输出一段 JSON 元数据，其中
          # variants 字段列出该模型支持的思考强度档位（如 deepseek-v4.1-flash-free
          # 有 low/high/max）。输出两列（\t 分隔）：opencode/<model-id>  逗号分隔 variant。
          cat > /tmp/parse_model_variants.py <<'PYEOF'
          import sys, json, re
          text = sys.stdin.read()
          parts = re.split(r'(?m)^opencode/([A-Za-z0-9][A-Za-z0-9._-]*)[ \t]*$', text)
          for i in range(1, len(parts) - 1, 2):
              mid, blob = parts[i], parts[i + 1]
              try:
                  meta = json.loads(blob)
              except Exception:
                  try:
                      meta = json.loads(blob[:blob.rindex('}') + 1])
                  except Exception:
                      continue
              variants = sorted((meta.get('variants') or {}).keys())
              print('opencode/%s\t%s' % (mid, ','.join(variants)))
          PYEOF
          build_model_pool() {
            local out tsv m v
            local pool=()
            # --refresh 强制拉取线上最新目录（避免 runner 本地缓存过期、错过新上的模型）；
            # refresh 失败时自动回退缓存目录，仍失败则返回空，由 detect_provider 惰性重建重试。
            out="$(opencode models opencode --verbose --refresh 2>/dev/null \
              || opencode models opencode --verbose 2>/dev/null \
              || opencode models --verbose 2>/dev/null \
              || true)"
            [ -z "$out" ] && return 1
            tsv="$(printf '%s\n' "$out" | python3 /tmp/parse_model_variants.py 2>/dev/null)" || true
            [ -z "$tsv" ] && return 1
            MODEL_VARIANTS=()
            while IFS=$'\t' read -r m v; do
              [ -n "$m" ] || continue
              pool+=("$m")
              MODEL_VARIANTS["$m"]="$v"
            done <<< "$tsv"
            [ ${#pool[@]} -eq 0 ] && return 1
            FREE_MODELS=("${pool[@]}")
            echo "[info] 动态模型池（${#FREE_MODELS[@]} 个）: ${FREE_MODELS[*]}"
            if printf '%s\n' "${FREE_MODELS[@]}" | grep -qx -- "$PREFERRED_MODEL"; then
              echo "[info] 优先模型在池中: $PREFERRED_MODEL (variant: ${MODEL_VARIANTS[$PREFERRED_MODEL]:-无})"
            else
              echo "[warn] 优先模型 $PREFERRED_MODEL 不在池中，本阶段改用随机模型"
            fi
            return 0
          }
          if ! build_model_pool; then
            echo "[warn] 启动时读取模型目录失败，模型池暂空；将随阶段重试自动重建"
            FREE_MODELS=()
            MODEL_VARIANTS=()
          fi

          # ================= workflow 防删自愈 =================
          # agent 的 clean 阶段可能把 .github 当作“多余内容”删除。
          # 启动时保存触发版本的 workflow 原始副本（触发 commit 必然包含它），
          # 每次提交前校验，一旦被删/被改立即恢复，保证循环链条永不断。
          WF_PATH=".github/workflows/continuous-loop.yml"
          PRISTINE=/tmp/wf_pristine.yml

          fetch_pristine() {
            # 优先：raw 直读触发 commit 的 workflow 文件（公共仓库免鉴权）
            if curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/${WF_PATH}" -o "$PRISTINE" 2>/dev/null && [ -s "$PRISTINE" ]; then
              return 0
            fi
            # 备选：仓库工作区副本（私有仓库 raw 不可达时）
            if [ -f "$WF_PATH" ]; then
              cp "$WF_PATH" "$PRISTINE"
              return 0
            fi
            return 1
          }

          ensure_workflow() {
            [ -s "$PRISTINE" ] || return 0
            if [ ! -f "$WF_PATH" ] || ! cmp -s "$WF_PATH" "$PRISTINE"; then
              mkdir -p "$(dirname "$WF_PATH")"
              cp "$PRISTINE" "$WF_PATH"
              echo "[guard] 检测到 workflow 文件被删除/篡改，已自动恢复"
            fi
          }

          if fetch_pristine && grep -q "Continuous Loop" "$PRISTINE"; then
            echo "[guard] workflow 原始副本就绪（$(wc -l < "$PRISTINE") 行）"
          else
            echo "[warn] 无法获取 workflow 原始副本，自愈保护不可用"
          fi
          ensure_workflow

          # ================= LICENSE 防删自愈 =================
          # agent 的 clean 阶段可能把 LICENSE 当作“多余内容”删除或篡改。
          # 启动时保存触发 commit 的 LICENSE 原始副本，
          # 每次提交前校验，一旦被删/被改立即恢复，保证 LICENSE 永不丢失。
          LICENSE_PATH="LICENSE"
          LICENSE_PRISTINE=/tmp/license_pristine

          fetch_license_pristine() {
            # 优先：raw 直读触发 commit 的 LICENSE（公共仓库免鉴权）
            if curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/LICENSE" -o "$LICENSE_PRISTINE" 2>/dev/null && [ -s "$LICENSE_PRISTINE" ]; then
              return 0
            fi
            # 备选：仓库工作区副本（私有仓库 raw 不可达时）
            if [ -f "$LICENSE_PATH" ]; then
              cp "$LICENSE_PATH" "$LICENSE_PRISTINE"
              return 0
            fi
            return 1
          }

          ensure_license() {
            [ -s "$LICENSE_PRISTINE" ] || return 0
            if [ ! -f "$LICENSE_PATH" ] || ! cmp -s "$LICENSE_PATH" "$LICENSE_PRISTINE"; then
              cp "$LICENSE_PRISTINE" "$LICENSE_PATH"
              echo "[guard] 检测到 LICENSE 被删除/篡改，已自动恢复"
            fi
          }

          if fetch_license_pristine; then
            echo "[guard] LICENSE 原始副本就绪（$(wc -c < "$LICENSE_PRISTINE") 字节）"
          else
            echo "[warn] 无法获取 LICENSE 原始副本，LICENSE 自愈保护不可用"
          fi
          ensure_license

          # ================= README.md 防删自愈 =================
          # clean 阶段可能把 README.md 当作“多余内容”删除。
          # 每次提交前校验：一旦被删，立即从 HEAD（其次最近一个包含它的历史版本）恢复；
          # 只防删除，允许正常的内容修改。
          ensure_readme() {
            # 保护所有语言版本的 README（README.md / README_zh.md / README_en.md）。
            # 只防删除；内容修改不受影响。
            for f in README.md README_zh.md README_en.md; do
              [ -f "$f" ] && continue
              if git show "HEAD:$f" > /tmp/readme_restore.md 2>/dev/null && [ -s /tmp/readme_restore.md ]; then
                mv /tmp/readme_restore.md "$f"
                echo "[guard] 检测到 $f 被删除，已从 HEAD 恢复"
                continue
              fi
              F_SHA=$(git log --format=%H --diff-filter=AM -- "$f" 2>/dev/null | head -1)
              if [ -n "$F_SHA" ] && git show "${F_SHA}:$f" > /tmp/readme_restore2.md 2>/dev/null && [ -s /tmp/readme_restore2.md ]; then
                mv /tmp/readme_restore2.md "$f"
                echo "[guard] 检测到 $f 被删除，已从历史版本 ${F_SHA:0:7} 恢复"
              else
                echo "[warn] $f 缺失且找不到可恢复的历史版本"
              fi
            done
            if [ -f README.md ] && grep -q 'currently contains the design/implementation plan' README.md; then
              if git show "HEAD:README.md" > /tmp/readme_restore3.md 2>/dev/null && [ -s /tmp/readme_restore3.md ]; then
                mv /tmp/readme_restore3.md README.md
                echo "[guard] README 退化成计划稿，已从 HEAD 恢复"
              fi
            fi
          }
          ensure_readme

          # ================= PLAN.md / 测试文件 防删自愈 =================
          # PLAN.md（如有）是项目规划文档，只防删除，允许正常修改；
          # 测试文件被删除时一律从 HEAD 恢复（同样允许正常修改）。
          ensure_plan() {
            [ -f PLAN.md ] && return 0
            if git show "HEAD:PLAN.md" > /tmp/plan_restore.md 2>/dev/null && [ -s /tmp/plan_restore.md ]; then
              mv /tmp/plan_restore.md PLAN.md
              echo "[guard] 检测到 PLAN.md 被删除，已从 HEAD 恢复"
            fi
          }
          ensure_tests() {
            git ls-files -- 'tests' '*_test.mbt' 2>/dev/null | while read -r f; do
              [ -n "$f" ] || continue
              if [ ! -e "$f" ]; then
                git checkout HEAD -- "$f" 2>/dev/null && echo "[guard] 检测到测试文件 $f 被删除，已从 HEAD 恢复"
              fi
            done
          }
          ensure_plan
          ensure_tests

          # ================= 质量门禁 =================
          # 门禁按仓库语言适配（编译/测试必须通过）；不通过则整段撤销。
          gate_check() {
            echo "=========== GATE CHECK ==========="
            bash moon test 2>&1
            local EC=$?
            if [ $EC -eq 0 ]; then
              echo "[gate] PASS"
            else
              echo "[gate] FAIL (exit=$EC) —— 本阶段改动将被撤销"
            fi
            return $EC
          }

          reject_phase() {
            # 阶段内允许 agent 自己 git commit（防超时丢进度），
            # 因此回滚要回到「本阶段开始时的 HEAD」，不能只回到当前 HEAD。
            local base="${PHASE_BASE:-HEAD}"
            echo "[gate] git reset --hard ${base} + git clean -fd —— 撤销本阶段全部改动"
            git reset --hard "$base"
            git clean -fd
            ensure_workflow
            ensure_license
          }

          i=0
          TEST_GATE_ITER=""

          # ---------- 提交信息附带本轮实际使用的模型（写入 /tmp/last_model_used.txt） ----------
          MODEL_TAG_FILE=/tmp/last_model_used.txt
          record_model() {
            printf '%s' "$1" > "$MODEL_TAG_FILE" 2>/dev/null || true
          }
          model_tag() {
            local m=""
            [ -f "$MODEL_TAG_FILE" ] && m="$(head -c 120 "$MODEL_TAG_FILE" 2>/dev/null)"
            [ -n "$m" ] && printf ' [model: %s]' "$m"
            return 0
          }

          remove_scratch_files() {
            # Agent sessions sometimes leave throwaway probes behind. They are
            # never part of the framework; remove them before every commit.
            find . -path ./.git -prune -o -type f \
              \( -name 'zz_*.mbt' -o -name 'tmp_*.mbt' -o -name '_scratch_*.mbt' \
                 -o -name 'dbg_*.mbt' -o -name '*_probe_*.mbt' -o -name 'probe_*.mbt' \) \
              -print -delete 2>/dev/null || true
          }

          commit_and_push() {
            ensure_workflow
            ensure_license
            ensure_readme
            ensure_plan
            ensure_tests
            remove_scratch_files
            rm -f .opencode_issues.md
            git add -A || true
            git commit -m "auto: iteration $1$(model_tag)" || true
            git pull --rebase origin "$BRANCH" || git rebase --abort || true
            git push origin "HEAD:${BRANCH}" || echo "[warn] push $1 failed"
          }

          on_shutdown() {
            echo "[trap] 收到 runner 终止信号，保存未提交的改动..."
            ensure_workflow
            ensure_license
            ensure_readme
            ensure_plan
            ensure_tests
            # 语法快速检查：半成品代码不允许进入历史（超时视为结果未知，保留改动）
            SYNTAX_EC=0
            timeout 300 bash moon test >/dev/null 2>&1 || SYNTAX_EC=$?
            if [ "$SYNTAX_EC" -ne 0 ] && [ "$SYNTAX_EC" -ne 124 ]; then
              echo "[trap] 语法检查未通过，丢弃未提交改动"
              git reset --hard HEAD
              git clean -fd
              exit 0
            fi
            [ "$SYNTAX_EC" -eq 124 ] && echo "[trap] 语法检查超时（结果未知），保留未提交改动"
            remove_scratch_files
            rm -f .opencode_issues.md
            git add -A || true
            if ! git diff --cached --quiet; then
              git commit -m "auto: partial work saved on shutdown$(model_tag)" || true
              git pull --rebase origin "$BRANCH" || git rebase --abort || true
              git push origin "HEAD:${BRANCH}" || true
              echo "[trap] partial work committed & pushed"
            else
              echo "[trap] nothing to commit"
            fi
            exit 0
          }
          trap on_shutdown TERM INT

          # ---------- 切换 provider（每次调用都重写配置，防 agent 篡改） ----------
          # NVIDIA 路径：切换到「权限锁定 + nvidia provider」配置，模型 glm-5.3(-flash)；
          # 免费路径：恢复权限锁定基准配置。
          switch_provider() {
            case "$1" in
              nvidia)
                cp -f "$HOME/.config/opencode/opencode.nvidia.json" "$HOME/.config/opencode/opencode.json" 2>/dev/null || true
                CURRENT_PROVIDER="nvidia"
                ;;
              *)
                cp -f "$HOME/.config/opencode/opencode.free.json" "$HOME/.config/opencode/opencode.json" 2>/dev/null || true
                CURRENT_PROVIDER="free"
                ;;
            esac
          }

          # ---------- 免费模型候选：优先 deepseek-v4.1-flash-free → big-pickle → 最多 3 个随机模型 ----------
          # 池是动态的（可能很大），探测时限制随机候选的数量，避免把 run 预算全耗在冒烟测试上。
          free_candidates() {
            local m x seen=" " n=${#FREE_MODELS[@]} extra=0 tries=0
            for m in "$PREFERRED_MODEL" "$FALLBACK_MODEL"; do
              [ -n "$m" ] || continue
              case "$seen" in *" $m "*) continue ;; esac
              for x in "${FREE_MODELS[@]}"; do
                if [ "$x" = "$m" ]; then
                  seen="$seen$m "
                  is_broken "$m" || echo "$m"
                  break
                fi
              done
            done
            while [ "$extra" -lt 3 ] && [ "$tries" -lt 12 ] && [ "$n" -gt 0 ]; do
              tries=$((tries+1))
              m="${FREE_MODELS[$((RANDOM % n))]}"
              case "$seen" in *" $m "*) continue ;; esac
              seen="$seen$m "
              is_broken "$m" && continue
              echo "$m"
              extra=$((extra+1))
            done
          }


          # ---------- 确定模型思考强度：优先 max，无 max 用 high，都不支持则不设置 ----------
          # 从模型官方元数据公布的 variant 列表中选取；都不支持时按默认方式启动
          # （不传 --variant），避免传无效值导致启动失败。
          variant_for() {
            local v="${MODEL_VARIANTS[$1]:-}"
            case ",$v," in
              *,max,*)  echo "max" ;;
              *,high,*) echo "high" ;;
              *)        echo "" ;;
            esac
          }

          # ---------- 冒烟测试：120s 内必须真实返回，否则视为不可用 ----------
          # 只看模型目录/端点健康不够——必须真跑一次，否则会选中“连得上但永远跑不完”的端点。
          smoke_test() {
            local m="$1" effort="" VARFLAG=()
            case "$m" in
              nvidia/*) ;;
              *) effort="$(variant_for "$m")" ;;
            esac
            if [ -n "$effort" ]; then VARFLAG=(--variant "$effort"); fi
            timeout --kill-after=30 120 opencode run -m "$m" ${VARFLAG[@]+"${VARFLAG[@]}"} "只回复两个字：OK" > /tmp/smoke_test.log 2>&1
          }

          # ---------- 一次性模型探测（每个 run 只做一次） ----------
          # run 开始时探测一次并固定 SELECTED_MODEL；之后所有阶段直接
          #   opencode run -m "$SELECTED_MODEL" ...
          # 只有收到 429 / 5xx / 连接失败 / 非零退出时，才标记当前候选失效、清空 SELECTED_MODEL
          # 并重新探测（跳过已失效的候选）。
          # 候选顺序沿用本仓库原策略：先掷骰决定是否优先 NVIDIA（NVIDIA_PROB，当前为 0），
          # 否则免费模型池优先（deepseek-v4.1-flash-free → big-pickle → 随机），NVIDIA 兜底。
          detect_provider() {
            local pass fam cand model order
            for pass in 1 2; do
              if [ "$NVIDIA_PROB" -gt 0 ] && [ $((RANDOM % 100)) -lt "$NVIDIA_PROB" ]; then
                order="nvidia free"
              else
                order="free nvidia"
              fi
              for fam in $order; do
                if [ "$fam" = "nvidia" ]; then
                  [ "$NVIDIA_PROB" -gt 0 ] || continue
                  is_broken nvidia && continue
                  if ! probe_nvidia; then
                    mark_broken nvidia
                    continue
                  fi
                  switch_provider nvidia
                  model="nvidia/$NVIDIA_MODEL"
                  if smoke_test "$model"; then
                    SELECTED_MODEL="$model"
                    SELECTED_PROVIDER="nvidia"
                    export SELECTED_MODEL
                    echo "[provider] 选定 $model（nvidia），本次 run 内固定使用，不再逐阶段探测"
                    return 0
                  fi
                  echo "[warn] $model 冒烟测试失败/超时，NVIDIA 候选失效"
                  mark_broken nvidia
                  continue
                fi

                # 免费模型池：池为空时先惰性重建（目录 API 瞬时故障的自愈）
                if [ ${#FREE_MODELS[@]} -eq 0 ]; then
                  build_model_pool || true
                fi
                while IFS= read -r cand; do
                  [ -n "$cand" ] || continue
                  switch_provider free
                  model="$cand"
                  if smoke_test "$model"; then
                    SELECTED_MODEL="$model"
                    SELECTED_PROVIDER="$cand"
                    export SELECTED_MODEL
                    echo "[provider] 选定 $model（免费模型池），本次 run 内固定使用，不再逐阶段探测"
                    return 0
                  fi
                  echo "[warn] $model 冒烟测试失败/超时，换下一个候选"
                  mark_broken "$cand"
                done <<< "$(free_candidates)"
              done
              # 第一轮全部失效：清空失效标记再试一轮（可能是瞬时故障）
              [ "$pass" -eq 1 ] && BROKEN_PROVIDERS=""
            done
            SELECTED_MODEL=""
            SELECTED_PROVIDER=""
            return 1
          }

          # run 开始时探测一次；失败也不阻塞，run_phase 需要时会再试
          if detect_provider; then :; else echo "[warn] 启动时未选出可用模型，第一个阶段会再探测一次"; fi

          # ---------- 单阶段执行 ----------
          # 每个 run 只在 detect_provider 里探测一次；阶段内直接用 SELECTED_MODEL，不再逐阶段探测。
          # 参数: phase_name  prompt  timeout_seconds
          # 返回: 0 成功 / 124|137|143 超时被杀（预算耗尽，改动照常提交）/ 1 时间用尽
          run_phase() {
            local phase="$1" prompt="$2" budget="$3"
            local attempt=0
            # 整个阶段（含所有重试）共用的硬上限：重试不得让总时长超过 budget
            local phase_end=$(( $(date +%s) + budget ))

            while :; do
              attempt=$((attempt+1))

              local NOW=$(date +%s)
              if [ "$NOW" -ge "$DEADLINE" ]; then
                echo "[info] phase=$phase 全局时间已用尽，跳过"
                return 1
              fi
              local REMAIN=$(( DEADLINE - NOW ))
              local budget_now=$(( phase_end - NOW ))
              [ "$budget_now" -gt "$REMAIN" ] && budget_now="$REMAIN"
              if [ "$budget_now" -le 60 ]; then
                echo "[info] phase=$phase 剩余时间不足，跳过"
                return 1
              fi

              # 正常路径：run 开始时已选定模型，这里不会发起任何网络探测
              if [ -z "$SELECTED_MODEL" ]; then
                if ! detect_provider; then
                  echo "[warn] phase=$phase 暂时没有可用模型，180s 后重试 (attempt=$attempt)"
                  sleep 180
                  continue
                fi
              fi

              # 防止 agent 写入的 opencode 配置干扰后续调用
              rm -f ./opencode.json ./opencode.jsonc ./.opencode.json 2>/dev/null

              # 思考强度：仅免费模型池的模型支持（优先 max，无 max 用 high），NVIDIA 不设置
              local EFFORT="" VARFLAG=()
              EFFORT="$(variant_for "$SELECTED_MODEL")"
              if [ -n "$EFFORT" ]; then
                VARFLAG=(--variant "$EFFORT")
                echo "[info] model=$SELECTED_MODEL 思考强度=$EFFORT"
              else
                echo "[info] model=$SELECTED_MODEL 按默认档位启动"
              fi
              echo "=========== iter #$i | phase=$phase | attempt=$attempt | provider=$SELECTED_PROVIDER | model=$SELECTED_MODEL effort=${EFFORT:-none} ==========="

              record_model "$SELECTED_MODEL"
              timeout --kill-after=180 "$budget_now" opencode run -m "$SELECTED_MODEL" ${VARFLAG[@]+"${VARFLAG[@]}"} "$prompt" 2>&1 | tee "$OUT"
              local EC=$?

              # 成功
              if [ $EC -eq 0 ]; then
                return 0
              fi

              # 超时 / 被杀：阶段预算耗尽属正常结束，改动照常提交
              if [ $EC -eq 124 ] || [ $EC -eq 137 ] || [ $EC -eq 143 ]; then
                echo "[warn] phase=$phase 超时/被杀 (exit=$EC)"
                return $EC
              fi

              # 429 限流 / 5xx / 连接失败：丢弃当前模型，下一次循环重新探测（并跳过它）
              if tail -40 "$OUT" | grep -qiE "too many requests|rate.?limit|status.{0,3}429|FreeTierError|free tier|status.{0,3}5[0-9][0-9]|econnreset|etimedout|fetch failed|socket hang up|connection (refused|reset)"; then
                echo "[warn] phase=$phase 限流/5xx/连接失败（$SELECTED_MODEL），重新探测 provider (attempt=$attempt)"
                mark_broken "$SELECTED_PROVIDER"
                SELECTED_MODEL=""
                sleep 60
                continue
              fi

              # 鉴权类错误提示（免费模型匿名限额耗尽/需要 key 时的排查线索）
              if tail -40 "$OUT" | grep -qiE "401|unauthorized|invalid.{0,4}api.?key|missing.{0,4}api.?key"; then
                echo "[hint] 疑似鉴权问题：匿名限额可能耗尽。可在仓库 secrets 配置 OPENCODE_API_KEY 提升限额后重试"
              fi

              # 其它非零退出：同样丢弃当前模型并重新探测，直到阶段预算或全局时间用尽
              echo "[warn] phase=$phase 调用失败 (exit=$EC, model=$SELECTED_MODEL)，重新探测 provider (attempt=$attempt)"
              mark_broken "$SELECTED_PROVIDER"
              SELECTED_MODEL=""
              sleep 60
            done
          }


          # ================= 单次调用内“先定位、再修复” =================
          # 不再单独占用 detect 预算：把“快速定位问题”并入同一次 opencode 调用，
          # 让修复拿满整个阶段预算，减少一次模型调用的固定开销。
          # 目标是在预算内尽可能多完成高价值改动，而不是只做一两个小改动。
          ISSUES_FILE=".opencode_issues.md"
          fast_prompt() {
            case "$1" in
              perf) printf '先用不超过 5-8 分钟快速扫描性能热点（可写入 `%s`，该临时清单不是报告），然后持续优化；在本阶段预算内尽可能多完成高价值、可验证的优化，不要只做 1-2 个就停，也不要为了赶时间提前结束。每个改动后运行自检；修复完成后删除该临时清单。\n\n%s\n' "$ISSUES_FILE" "$2" ;;
              bug)  printf '先快速定位 bug（可把要点写入 `%s`，该临时清单不是报告），然后持续修复；在本阶段预算内尽可能多修复高价值、可验证的 bug，不要只修一个就停，也不要为了赶时间提前结束。每个修复后运行自检；修完删除该临时清单。\n\n%s\n' "$ISSUES_FILE" "$2" ;;
              sci)  printf '先用不超过 5-8 分钟选出高价值实验方法问题（可写入 `%s`，该临时清单不是报告），然后持续改进；在本阶段预算内尽可能多完成实质性改进，不要只做 1-2 个就停，也不要为了赶时间提前结束。每个改动后运行自检；修复完成后删除该临时清单。\n\n%s\n' "$ISSUES_FILE" "$2" ;;
            esac
          }

          # ================= 测试门（取消 20% 抽样）=================
          # 在写代码阶段（bug / improve / complete）提交之后触发（调用点见主循环）。
          # MoonBit 全量 `bash moon test` 需要编译整个包，成本较高；按 spec 允许的降级方案，
          # 每个 iteration 只跑一次（在第一个提交后的写代码阶段执行），不再 20% 抽样跳过。
          # 跑不通 → 调用 opencode 修复 → 修复结果按本仓库既有提交路径落到 main/master。
          maybe_run_tests() {
            local iter="$1"
            if [ "$TEST_GATE_ITER" = "$iter" ]; then
              echo "[test-gate] iter #$iter 已执行过测试门，本 iteration 不重复运行"
              return 0
            fi
            TEST_GATE_ITER="$iter"
            echo "[test-gate] iter #$iter 执行全量测试（每个 iteration 一次）"
            local TG_REMAIN=$(( DEADLINE - $(date +%s) ))
            if [ "$TG_REMAIN" -lt 1200 ]; then
              echo "[test-gate] 剩余时间不足 20 分钟，放弃本次测试"
              return 0
            fi
            cat > /tmp/tg_run.sh <<'TGEOF'
            set +e
            [ -f moon ] || exit 42
            bash moon test
            exit $?
          TGEOF
            local TG_LOG=/tmp/test_gate.log
            echo "=========== TEST GATE (iter #$iter) ==========="
            timeout --kill-after=60 1500 bash /tmp/tg_run.sh > "$TG_LOG" 2>&1
            local TG_EC=$?
            tail -25 "$TG_LOG" 2>/dev/null || true
            if [ "$TG_EC" -eq 0 ]; then
              echo "[test-gate] 测试通过，无需修复"
              return 0
            fi
            if [ "$TG_EC" -eq 42 ]; then
              echo "[test-gate] 本仓库没有可识别的测试，跳过"
              return 0
            fi
            if [ "$TG_EC" -eq 43 ]; then
              echo "[test-gate] 测试依赖环境不可用（安装失败），跳过修复"
              return 0
            fi
            if [ "$TG_EC" -eq 124 ] || [ "$TG_EC" -eq 137 ] || [ "$TG_EC" -eq 143 ]; then
              echo "[test-gate] 测试超时/被中断 (exit=$TG_EC)，结果不确定，本轮不修复"
              return 0
            fi
            echo "[test-gate] 测试未通过 (exit=$TG_EC)，调用 opencode 修复"
            local TG_FIX_BUDGET=$(( DEADLINE - $(date +%s) - 900 ))
            if [ "$TG_FIX_BUDGET" -lt 900 ]; then
              echo "[test-gate] 剩余时间不足以安排修复，仅记录失败"
              return 0
            fi
            if [ "$TG_FIX_BUDGET" -gt 10800 ]; then TG_FIX_BUDGET=10800; fi
            {
              echo '本仓库的测试跑不通，请修复。复现方式：在仓库根目录运行 bash /tmp/tg_run.sh。'
              echo
              echo '失败日志（最后 80 行）：'
              tail -80 "$TG_LOG" 2>/dev/null
              echo
              echo '要求：'
              echo '1. 只修复导致测试失败的问题，不得削弱、跳过或删除测试，不得修改门禁脚本让断言失效；'
              echo '2. 不要借修复之名重写无关代码，保持原有功能语义不变；'
              echo '3. .github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；'
              echo '4. 修复后必须自行运行测试并确认完全通过。'
            } > /tmp/tg_fix_prompt.txt
            PHASE_BASE="$(git rev-parse HEAD)"
            run_phase "testfix" "$(cat /tmp/tg_fix_prompt.txt)" "$TG_FIX_BUDGET" || true


            # 修复结果走与各阶段一致的质量门禁 + 提交路径（main/master）
            if gate_check; then
              commit_and_push "$iter-testfix"
            else
              reject_phase
            fi

            return 0
          }

          # ================= 主循环 =================
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            i=$((i+1))

            AVAIL_MB=$(( $(df --output=avail / | tail -1) / 1024 ))
            echo "--- iteration #$i | free disk: ${AVAIL_MB}MB ---"
            free -h | head -2
            if [ "$AVAIL_MB" -lt 2048 ]; then
              echo "[error] 磁盘剩余不足 2GB，提前结束循环，交给收尾步骤清理"
              break
            fi

            # ----- 阶段：perf 已停用（perf 的 opencode 调用已注释掉）→ bug -> improve -> complete（clean 已移除）-----
            # for phase in perf bug improve complete clean; do
            for phase in bug improve complete; do
              case "$phase" in
                perf)     P="$PROMPT_PERF";     T="$PERF_TIMEOUT"     ;;
                bug)      P="$PROMPT_BUG";      T="$BUG_TIMEOUT"      ;;
                improve)  P="$PROMPT_IMPROVE";  T="$IMPROVE_TIMEOUT"  ;;
                complete) P="$PROMPT_COMPLETE"; T="$COMPLETE_TIMEOUT" ;;
                clean)    P="$PROMPT_CLEAN";    T="$CLEAN_TIMEOUT"    ;;
              esac

              # 收窄到剩余时间
              REMAIN=$(( DEADLINE - $(date +%s) ))
              if [ "$REMAIN" -le 0 ]; then
                echo "[info] 全局时间已到，退出循环"
                break 2
              fi
              if [ "$T" -gt "$REMAIN" ]; then T="$REMAIN"; fi

              echo ">>> iteration #$i | phase=$phase | budget=${T}s"
              case "$phase" in
                perf|bug) P="$(fast_prompt "$phase" "$P")" ;;
              esac
              PHASE_BASE="$(git rev-parse HEAD)"
              run_phase "$phase" "$P" "$T"


              # ---- 质量门禁：通过才提交；不通过则整段撤销 ----
              if gate_check; then
                commit_and_push "$i-$phase"
              else
                reject_phase
              fi

              # ⭐ 测试门：写代码阶段（bug / improve / complete）提交后都触发；每个 iteration 只跑一次，详见 maybe_run_tests
              case "$phase" in
                bug|improve|complete) maybe_run_tests "$i" ;;
              esac

              sleep 5
            done
          done
      - name: Cleanup repo artifacts
        if: always()
        run: |
          set +e
          rm -f .opencode_issues.md
          rm -f opencode.json opencode.jsonc .opencode.json 2>/dev/null
          find . -type f -name 'REPORT*.md'          -not -path './.git/*' -delete
          find . -type f -name 'autodl_budget*.json' -not -path './.git/*' -delete

      - name: Final commit and push
        if: always()
        run: |
          set +e
          # 防删自愈：收尾提交前恢复被删/改的 workflow
          WF=".github/workflows/continuous-loop.yml"
          PRISTINE=/tmp/wf_pristine.yml
          if [ ! -s "$PRISTINE" ] && [ -n "${GITHUB_SHA:-}" ]; then
            curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/${WF}" -o "$PRISTINE" 2>/dev/null || true
          fi
          if [ -s "$PRISTINE" ] && { [ ! -f "$WF" ] || ! cmp -s "$WF" "$PRISTINE"; }; then
            mkdir -p .github/workflows
            cp "$PRISTINE" "$WF"
            echo "[guard] 收尾阶段发现 workflow 被删/改，已恢复"
          fi
          # 防删自愈：收尾提交前恢复被删/改的 LICENSE
          LIC="LICENSE"
          LIC_PRISTINE=/tmp/license_pristine
          if [ ! -s "$LIC_PRISTINE" ] && [ -n "${GITHUB_SHA:-}" ]; then
            curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/LICENSE" -o "$LIC_PRISTINE" 2>/dev/null || true
          fi
          if [ -s "$LIC_PRISTINE" ] && { [ ! -f "$LIC" ] || ! cmp -s "$LIC" "$LIC_PRISTINE"; }; then
            cp "$LIC_PRISTINE" "$LIC"
            echo "[guard] 收尾阶段发现 LICENSE 被删/改，已恢复"
          fi
          # 防删自愈：收尾提交前恢复被删的 README.md
          if [ ! -f "README.md" ]; then
            if git show HEAD:README.md > /tmp/readme_restore.md 2>/dev/null && [ -s /tmp/readme_restore.md ]; then
              mv /tmp/readme_restore.md README.md
            else
              README_SHA=$(git log --format=%H --diff-filter=AM -- README.md 2>/dev/null | head -1)
              if [ -n "$README_SHA" ] && git show "${README_SHA}:README.md" > /tmp/readme_restore2.md 2>/dev/null && [ -s /tmp/readme_restore2.md ]; then
                mv /tmp/readme_restore2.md README.md
              fi
            fi
            [ -f README.md ] && echo "[guard] 收尾阶段发现 README.md 被删，已恢复"
          fi
          # 防删自愈：收尾提交前恢复被删的多语言 README 与 PLAN.md
          for f in README_zh.md README_en.md PLAN.md; do
            if [ ! -f "$f" ] && git show "HEAD:$f" > "/tmp/final_restore_$f" 2>/dev/null && [ -s "/tmp/final_restore_$f" ]; then
              mv "/tmp/final_restore_$f" "$f"
              echo "[guard] 收尾阶段发现 $f 被删，已恢复"
            fi
          done
          # 防删自愈：收尾提交前恢复被删的测试文件
          git ls-files -- 'tests' '*_test.mbt' 2>/dev/null | while read -r f; do
            [ -n "$f" ] || continue
            if [ ! -e "$f" ]; then
              git checkout HEAD -- "$f" 2>/dev/null && echo "[guard] 收尾阶段发现测试文件 $f 被删，已恢复"
            fi
          done

          # 质量门禁：收尾状态必须可运行，否则回退到最后一次已验证状态
          gate_final() {
            bash moon test 2>&1
          }
          if ! gate_final; then
            echo "[gate] 收尾状态未通过，回退到 HEAD"
            git reset --hard HEAD
            git clean -fd
          fi
          git add -A
          LAST_MODEL="$(head -c 120 /tmp/last_model_used.txt 2>/dev/null || true)"
          git commit -m "auto: end of 3h run, cleanup${LAST_MODEL:+ [model: $LAST_MODEL]}" || echo "nothing to commit"
          BRANCH="${GITHUB_REF_NAME:-main}"
          git pull --rebase origin "$BRANCH" || git rebase --abort || true
          git push origin "HEAD:${BRANCH}" || echo "[warn] final push failed"

      - name: Push to Gitee
        if: always()
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          set +e
          if [ -z "$GITEE_TOKEN" ] || [ -z "$GITEE_REPO" ]; then
            echo "GITEE_TOKEN or GITEE_REPO not set, skipping Gitee push."
            exit 0
          fi
          BRANCH="${GITHUB_REF_NAME:-main}"
          git remote remove gitee 2>/dev/null || true
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          git push gitee "HEAD:${BRANCH}" --force || echo "[warn] push to Gitee failed"
  # ===== loop hand-off (added) =====

  # ⭐ 立刻续跑（下）：独立的收尾 job。
  # needs + if: always()：工作 job 无论成功、失败、超时被取消，这个 job 都会紧接着启动（已实测验证）。
  # 这里无条件派发一个新的后继 run：它在组内排队，本 run 退出的一瞬间就被调度。
  # 万一这个 job 连启动都没机会（整个 run 被强杀），*/15 心跳会兜底。
  next-run:
    needs: [run-opencode]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Ensure next run is queued
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          BRANCH="${GITHUB_REF_NAME}"
          WF_REF="${GITHUB_WORKFLOW_REF%%@*}"
          WF_FILE="${WF_REF##*/}"
          case "$WF_FILE" in
            *.yml|*.yaml) ;;
            *) WF_FILE="continuous-loop.yml" ;;
          esac
          echo "[loop] repo=${GH_REPO} workflow=${WF_FILE} branch=${BRANCH} run=${RUN_ID}"
          for attempt in 1 2 3 4 5; do
            if gh workflow run "$WF_FILE" --ref "$BRANCH"; then
              echo "[loop] 已派发后继 run（attempt ${attempt}）——本 run 结束后立刻起跑"
              exit 0
            fi
            echo "[loop][warn] 派发失败（attempt ${attempt}）10s 后重试"
            sleep 10
          done
          echo "[loop][warn] 派发失败；下一次 */15 心跳会补位"
          exit 0
